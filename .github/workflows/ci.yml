name: Controlli

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  controlli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Controllo anti-segreti (token, chiavi API, chiavi private)
        run: bash scripts/check-secrets.sh

      - name: Test del motore di calcolo e delle esportazioni
        run: node --test
